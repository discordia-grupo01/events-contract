    UserPresenceChanged:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
        connections:
          type: string
          enum:
            - active
            - idle
            - none
          description: Estado real de las conexiones del usuario, de todas sus instancias y dispositivos.
        do_not_disturb:
          type: boolean
          description: '`true` si el usuario eligió No molestar. Se manda siempre.'
        version:
          type: integer
          format: int64
          description: Crece con cada cambio del mismo usuario. El consumidor aplica el evento solo si es mayor a la que ya tiene.
      required: [event_id, occurred_at, user_id, connections, do_not_disturb, version]
    ReportUpdated:
      description: 'ReportUpdated is published by servers when a user or message report is created and every time its status changes. Admin consumes it to build the investigation dossier of a user without asking servers. It is a full snapshot of the report, not a diff. There is no version: the consumer keeps the snapshot with the newest occurred_at of each report, so a repeated or out-of-order delivery doesn''t overwrite newer data (same rule as servers.ServerUpdated). Optional fields are always present and marshal as null when empty (no omitempty): ReportedUserID is null when Kind is KindMessage, ChannelID and MessageID are null when Kind is KindUser, and ResolvedAt is null while the report is pending. It carries neither the reporter nor the moderator who resolved it (data minimization): the dossier is about the reported user, and who reported or resolved is only needed inside servers.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        report_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - user
            - message
          description: Qué se reportó.
        reported_user_id:
          type: [string, "null"]
          format: uuid
          description: Usuario reportado (ID de discordia-identify). `null` si `kind` es `message`.
        channel_id:
          type: [string, "null"]
          format: uuid
          description: Canal del mensaje reportado. `null` si `kind` es `user`.
        message_id:
          type: [string, "null"]
          format: uuid
          description: Mensaje reportado. `null` si `kind` es `user`.
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: Motivo que escribió quien reportó.
        status:
          type: string
          enum:
            - pending
            - resolved
            - dismissed
        created_at:
          type: string
          format: date-time
          description: Fecha de creación del reporte, ISO 8601 en UTC.
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: Fecha de cierre del reporte, ISO 8601 en UTC. `null` mientras está `pending`.
      required:
        - event_id
        - occurred_at
        - report_id
        - server_id
        - kind
        - reported_user_id
        - channel_id
        - message_id
        - reason
        - status
        - created_at
        - resolved_at
    EmojiCreated:
      description: 'EmojiCreated is published by servers when a custom emoji is added to a server. Like EmojiDeleted, it carries the whole emoji: an emoji never changes after it is created, so its only transition is being deleted, and that transition wins whatever order the two events arrive in.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        emoji_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
          pattern: ^[A-Za-z0-9_]{2,32}$
        animated:
          type: boolean
          description: true si la imagen es un GIF; usarlo requiere Premium.
        image_url:
          type: string
          format: uri
      required: [event_id, occurred_at, emoji_id, server_id, name, animated, image_url]
    EmojiDeleted:
      description: 'EmojiDeleted is published by servers when a custom emoji is deleted. It can no longer be used in new messages or reactions, but the image stays available: consumers keep it so the messages and reactions that already use it still show it.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        emoji_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
          pattern: ^[A-Za-z0-9_]{2,32}$
        animated:
          type: boolean
          description: true si la imagen es un GIF; usarlo requiere Premium.
        image_url:
          type: string
          format: uri
      required: [event_id, occurred_at, emoji_id, server_id, name, animated, image_url]
    ResourceChanged:
      description: 'ResourceChanged is published by servers when something a client keeps on screen changed and no other event says so: the server''s name, icon, banner or vanity link, its channels and categories (rename, move, reorder, create), or its roles (reorder, default role). It carries no data, only what to ask for again, so a consumer never needs the new state and a repeated or out-of-order delivery is harmless.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
          description: Servidor al que pertenece lo que cambió.
        resource:
          type: string
          enum:
            - server
            - channels
            - roles
          description: 'Qué volver a pedir: los datos del servidor, sus canales y categorías, o sus roles.'
      required: [event_id, occurred_at, server_id, resource]
    ServerDeleted:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
        channel_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Ids de todos los canales (texto y voz) que tenía el servidor. Puede ser vacío, nunca null.
      required: [event_id, occurred_at, server_id, channel_ids]
    ServerUpdated:
      description: 'ServerUpdated is published by servers when a server is created and every time its name or owner changes. It is a full snapshot, not a diff, so consumers don''t need the previous state. There is no version: the consumer keeps the snapshot with the newest occurred_at of each server, so a repeated or out-of-order delivery doesn''t overwrite newer data (same rule as the permissions events). Built for admin''s back-office listing, which shows the name, owner and creation date of every server without asking servers.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          description: ID del dueño del servidor (emitido por discordia-identify).
        created_at:
          type: string
          format: date-time
          description: Fecha de creación del servidor, ISO 8601 en UTC. No cambia entre fotos.
      required: [event_id, occurred_at, server_id, name, owner_id, created_at]
    AccountRegistered:
      description: 'AccountRegistered is published by identify once, when an account is created. It carries the data of the account itself (as opposed to the public profile of ProfileUpdated) for the one consumer that needs it: admin''s back-office listing, which searches users by email. Email and CreatedAt never change, so there is no version: a repeated delivery is harmless because applying it again leaves the same values. Do not add this event to consumers that only need the public profile -- the email is private data. EmailVerified is true when the account was born verified (OAuth sign-up) and false for an email sign-up, which stays pending until EmailVerified arrives. Events published before this field existed don''t carry it, so they decode as false.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: ID del usuario en discordia-identify.
        email:
          type: string
          format: email
          description: Email de la cuenta. Dato privado; solo para el backoffice.
        name:
          type: string
          description: Nombre al momento del registro (los cambios posteriores viajan en `users.profile_updated`).
        created_at:
          type: string
          format: date-time
          description: Fecha de registro de la cuenta, ISO 8601 en UTC.
        email_verified:
          type: boolean
          description: 'Si el email ya estaba verificado al crear la cuenta: `true` en las altas por OAuth, `false` en el registro con email. Los eventos anteriores a la versión 0.5.0 no lo traen: el consumidor lo toma como `false`.'
      required: [event_id, occurred_at, user_id, email, name, created_at]
    EmailVerified:
      description: 'EmailVerified is published by identify once, when the user confirms the email of an account created with email sign-up (OAuth sign-ups never publish it: they are already verified in AccountRegistered). Like AccountRegistered it only exists for admin''s back-office listing, which shows unverified accounts as pending. Verification is never undone, so there is no version: a repeated or out-of-order delivery is harmless, and it may arrive before AccountRegistered.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: ID del usuario en discordia-identify.
        verified_at:
          type: string
          format: date-time
          description: Momento en que se confirmó el email, ISO 8601 en UTC.
      required: [event_id, occurred_at, user_id, verified_at]
    ProfileUpdated:
      description: 'ProfileUpdated is published by identify when a user is created and every time their public profile or status changes. It is a full snapshot, not a diff, so consumers don''t need the previous state. Version is identify''s profile_version: it grows with every change of the same user, and a consumer applies a snapshot only if its version is higher than the one it already has (duplicates and out-of-order deliveries are then harmless). Only public fields travel: the email never does.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: ID del usuario en discordia-identify.
        version:
          type: integer
          format: int64
          minimum: 1
          description: profile_version del usuario en identify. Crece con cada cambio; ordena las fotos del mismo usuario.
        name:
          type: string
        avatar_url:
          type: string
          description: URL pública del avatar, o vacío si no tiene.
        description:
          type: string
          description: Vacío si no tiene.
        status_text:
          type: string
          description: Texto del estado personalizado, o vacío si no tiene.
        status_emoji:
          type: string
          description: Emoji del estado personalizado, o vacío si no tiene.
      required:
        - event_id
        - occurred_at
        - user_id
        - version
        - name
        - avatar_url
        - description
        - status_text
        - status_emoji
    ParticipantJoined:
