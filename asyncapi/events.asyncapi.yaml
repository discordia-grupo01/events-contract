      required: [event_id, occurred_at, conversation_id, message_id, author_id, recipient_id]
    MessageCreated:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
