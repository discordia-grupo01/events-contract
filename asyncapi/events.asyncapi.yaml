asyncapi: 3.0.0
info:
  title: Discordia — Contrato de eventos (generado)
  version: generated
  description: 'Documento generado por `go run ./cmd/eventsgen gen` a partir de las structs de Go de `events-contract`. No se edita a mano: el CI falla si no coincide con el código. Cada payload se valida con los JSON Schema de la carpeta `schemas/`.'
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: Broker RabbitMQ.
    variables:
      host:
        default: localhost:5672
defaultContentType: application/json
channels:
  adminServerDeletionRequested:
    address: admin.server_deletion_requested
    title: admin.server_deletion_requested
    description: 'ServerDeletionRequested is published by admin when staff asks to delete a server. It is a request, not the fact: servers runs the same cascade it runs when the owner deletes the server and then publishes servers.server_deleted, which the other services already consume. It is irreversible, so servers must check the signature before touching anything. Same fields as ServerSuspended.'
    messages:
      serverDeletionRequested:
        $ref: '#/components/messages/ServerDeletionRequested'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  adminServerReactivated:
    address: admin.server_reactivated
    title: admin.server_reactivated
    description: ServerReactivated is published by admin when staff lifts a server suspension. Same fields and rules as ServerSuspended.
    messages:
      serverReactivated:
        $ref: '#/components/messages/ServerReactivated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  adminServerSuspended:
    address: admin.server_suspended
    title: admin.server_suspended
    description: 'ServerSuspended is published by admin when staff suspends a server. The server keeps its content, but nobody can use it until it is reactivated: servers rejects every action on it except leaving, messaging rejects reads and writes in its channels and closes their open sockets, and voice takes whoever is connected out of the room. Version is admin''s moderation_version for that server: it grows with every suspension, reactivation or deletion request, and a consumer applies an event only if its version is higher than the one it already has. The reason never travels (data minimisation).'
    messages:
      serverSuspended:
        $ref: '#/components/messages/ServerSuspended'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  adminStaffMemberAdded:
    address: admin.staff_member_added
    title: admin.staff_member_added
    messages:
      staffMemberAdded:
        $ref: '#/components/messages/StaffMemberAdded'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  adminStaffMemberRemoved:
    address: admin.staff_member_removed
    title: admin.staff_member_removed
    messages:
      staffMemberRemoved:
        $ref: '#/components/messages/StaffMemberRemoved'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  adminUserReactivated:
    address: admin.user_reactivated
    title: admin.user_reactivated
    description: UserReactivated is published by admin when staff lifts a suspension. Same fields and rules as UserSuspended.
    messages:
      userReactivated:
        $ref: '#/components/messages/UserReactivated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  adminUserSuspended:
    address: admin.user_suspended
    title: admin.user_suspended
    description: 'UserSuspended is published by admin when staff suspends an account. Every service that serves users (identify, servers, messaging, voice) reacts by rejecting anything that user does and cutting their open sessions. Version is admin''s suspension_version for that user: it grows with every suspension or reactivation, and a consumer applies an event only if its version is higher than the one it already has, so duplicated or out-of-order deliveries are harmless. The reason for the suspension never travels (data minimisation).'
    messages:
      userSuspended:
        $ref: '#/components/messages/UserSuspended'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  billingAccountChanged:
    address: billing.account_changed
    title: billing.account_changed
    description: 'Changed is published by billing every time something of a user''s account that the clients show changes: the points balance and its history (a purchase confirmed, points spent or given back by a boost), the boosts the user holds, or the purchases. It carries no data, only what to ask for again, so a repeated or out-of-order delivery is harmless. Premium has its own signed snapshot, billing.premium_updated. It is not signed: the worst a forged one can do is make a screen ask again for what it already shows.'
    messages:
      accountChanged:
        $ref: '#/components/messages/AccountChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  adminBackofficeChanged:
    address: admin.backoffice_changed
    title: admin.backoffice_changed
    description: 'Changed is published by admin when something the back-office shows to staff changed: a user, a server, a report, the staff itself or the investigation file of a user or a server. It carries no data, only what to ask for again, and the staff members who should be told, so notifications can push it to them without knowing who is staff. It is not signed: the worst a forged one can do is make a staff screen ask again for what it already shows.'
    messages:
      backofficeChanged:
        $ref: '#/components/messages/BackofficeChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  billingPremiumUpdated:
    address: billing.premium_updated
    title: billing.premium_updated
    description: 'PremiumUpdated is a full snapshot of a user''s Premium, not a diff. billing publishes it when Premium starts, renews, stops renewing, is revoked (refund or chargeback) or expires. Active is what consumers apply. PremiumUntil (nil if the user never paid) and Renews are for display: when PremiumUntil passes, billing publishes another snapshot with Active false, so consumers never need a clock. Version grows with every snapshot of the same user; a consumer applies an event only if its version is higher than the one it already has, so duplicated or out-of-order deliveries are harmless.'
    messages:
      premiumUpdated:
        $ref: '#/components/messages/PremiumUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  billingServerBoostRequested:
    address: billing.server_boost_requested
    title: billing.server_boost_requested
    description: 'SagaEvent is the message of every signed step. Processing it twice has no effect: BoostID identifies the boost on both sides.'
    messages:
      serverBoostRequested:
        $ref: '#/components/messages/ServerBoostRequested'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  billingServerBoostCancelled:
    address: billing.server_boost_cancelled
    title: billing.server_boost_cancelled
    description: 'SagaEvent is the message of every signed step. Processing it twice has no effect: BoostID identifies the boost on both sides.'
    messages:
      serverBoostCancelled:
        $ref: '#/components/messages/ServerBoostCancelled'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  billingServerBoostRemoved:
    address: billing.server_boost_removed
    title: billing.server_boost_removed
    description: 'SagaEvent is the message of every signed step. Processing it twice has no effect: BoostID identifies the boost on both sides.'
    messages:
      serverBoostRemoved:
        $ref: '#/components/messages/ServerBoostRemoved'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversServerBoostApplied:
    address: servers.server_boost_applied
    title: servers.server_boost_applied
    description: 'SagaEvent is the message of every signed step. Processing it twice has no effect: BoostID identifies the boost on both sides.'
    messages:
      serverBoostApplied:
        $ref: '#/components/messages/ServerBoostApplied'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversServerBoostRejected:
    address: servers.server_boost_rejected
    title: servers.server_boost_rejected
    description: 'SagaEvent is the message of every signed step. Processing it twice has no effect: BoostID identifies the boost on both sides.'
    messages:
      serverBoostRejected:
        $ref: '#/components/messages/ServerBoostRejected'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversServerBoostUpdated:
    address: servers.server_boost_updated
    title: servers.server_boost_updated
    description: ServerBoostUpdated is a full snapshot of a server's boosts, not a diff. A consumer applies it only if Version is higher than the one it has, so duplicated or out-of-order deliveries are harmless.
    messages:
      serverBoostUpdated:
        $ref: '#/components/messages/ServerBoostUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversChannelAccessRevoked:
    address: servers.channel_access_revoked
    title: servers.channel_access_revoked
    description: 'ChannelAccessRevoked is published when members who could see a channel (VIEW_CHANNELS after its per-role overrides) no longer can: an override or a role''s permissions changed, a role was assigned, removed or deleted, the ownership was transferred, or the member was kicked, banned or left. There is one event per affected channel, text or voice; UserIDs holds only the members who lost access, never empty. Consumers cut what those users have open in the channel (a messaging socket, a voice room); gaining access is never published.'
    messages:
      channelAccessRevoked:
        $ref: '#/components/messages/ChannelAccessRevoked'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversChannelCreated:
    address: servers.channel_created
    title: servers.channel_created
    description: ChannelCreated is published when a text or voice channel is created inside a server.
    messages:
      channelCreated:
        $ref: '#/components/messages/ChannelCreated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversChannelDeleted:
    address: servers.channel_deleted
    title: servers.channel_deleted
    description: ChannelDeleted is published when a channel is removed from a server.
    messages:
      channelDeleted:
        $ref: '#/components/messages/ChannelDeleted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversMemberJoined:
    address: servers.member_joined
    title: servers.member_joined
    description: MemberJoined is published when a user joins a server.
    messages:
      memberJoined:
        $ref: '#/components/messages/MemberJoined'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversMemberLeft:
    address: servers.member_left
    title: servers.member_left
    description: MemberLeft is published when a user leaves (or is removed from) a server.
    messages:
      memberLeft:
        $ref: '#/components/messages/MemberLeft'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  messagingDirectMessageCreated:
    address: messaging.direct_message_created
    title: messaging.direct_message_created
    messages:
      directMessageCreated:
        $ref: '#/components/messages/DirectMessageCreated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  messagingMessageCreated:
    address: messaging.message_created
    title: messaging.message_created
    messages:
      messageCreated:
        $ref: '#/components/messages/MessageCreated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  messagingMessageDeleted:
    address: messaging.message_deleted
    title: messaging.message_deleted
    description: MessageDeleted is published when a message is deleted, in a server channel or in a direct conversation (ServerID is empty then and ChannelID is the conversation). OccurredAt is the moment of the deletion. A consumer drops whatever it kept about MessageID.
    messages:
      messageDeleted:
        $ref: '#/components/messages/MessageDeleted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  messagingMessageUpdated:
    address: messaging.message_updated
    title: messaging.message_updated
    description: 'MessageUpdated is published when the text of a message in a server channel is edited. It carries the mentions the message has after the edit, so a consumer can add the notification of whoever the edit mentioned and remove the one of whoever it stopped mentioning. OccurredAt is the moment of the edit. Direct messages never publish it: they have no mentions.'
    messages:
      messageUpdated:
        $ref: '#/components/messages/MessageUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversMemberBanned:
    address: servers.member_banned
    title: servers.member_banned
    description: MemberBanned is published when a member is banned from a server. The same transaction also publishes membership.MemberLeft, so consumers that only track membership don't need to know about bans.
    messages:
      memberBanned:
        $ref: '#/components/messages/MemberBanned'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversMemberKicked:
    address: servers.member_kicked
    title: servers.member_kicked
    description: MemberKicked is published when a member is kicked from a server. Unlike a ban, nothing stops them from rejoining with a valid invitation. The same transaction also publishes membership.MemberLeft, so consumers that only track membership don't need to know about kicks.
    messages:
      memberKicked:
        $ref: '#/components/messages/MemberKicked'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversMemberMuted:
    address: servers.member_muted
    title: servers.member_muted
    description: MemberMuted is published when a member loses the ability to send messages and publish voice for a limited period. The session remains connected.
    messages:
      memberMuted:
        $ref: '#/components/messages/MemberMuted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversMemberUnbanned:
    address: servers.member_unbanned
    title: servers.member_unbanned
    description: 'MemberUnbanned is published when a ban is revoked. It does not make the user a member again: they still need a valid invitation to rejoin.'
    messages:
      memberUnbanned:
        $ref: '#/components/messages/MemberUnbanned'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversMemberUnmuted:
    address: servers.member_unmuted
    title: servers.member_unmuted
    description: MemberUnmuted is published when a mute is manually revoked or expires.
    messages:
      memberUnmuted:
        $ref: '#/components/messages/MemberUnmuted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversModerationActionRecorded:
    address: servers.moderation_action_recorded
    title: servers.moderation_action_recorded
    description: 'ModerationActionRecorded is published by servers every time a moderation action (ban, unban, kick, mute or unmute) is written to its audit log. Admin consumes it to build the investigation dossier of a user without asking servers. Meta.OccurredAt is the moment of the action, the same occurred_at as the audit log entry. An audit entry never changes, so the event is immutable: ActionID is the id of the audit entry and the idempotency key, and a repeated delivery with the same ActionID must be ignored. It carries neither the moderator who acted nor the reason (data minimization): the dossier is about the target user, and who acted is only needed inside servers.'
    messages:
      moderationActionRecorded:
        $ref: '#/components/messages/ModerationActionRecorded'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversWordFilterUpdated:
    address: servers.word_filter_updated
    title: servers.word_filter_updated
    description: 'WordFilterUpdated is published every time a server''s banned words list changes. It carries the whole list, not a diff, so consumers keep the one with the newest occurred_at and a repeated or late event never undoes a newer change. Words must never be nil: an empty list (no filter) has to marshal as [] and not as null.'
    messages:
      wordFilterUpdated:
        $ref: '#/components/messages/WordFilterUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversOwnershipTransferUpdated:
    address: servers.ownership_transfer_updated
    title: servers.ownership_transfer_updated
    description: 'TransferUpdated is published by servers every time an ownership transfer changes state: when the owner offers it (pending), when the recipient accepts or rejects it, when the owner cancels it and when it expires after 24 hours. It is a full snapshot, so a consumer keeps the one with the newest occurred_at of each transfer and a repeated or out-of-order delivery doesn''t overwrite newer data. OccurredAt is the moment of the change: the creation time for pending and the resolution time for the rest. The notification goes to the recipient while the transfer is pending and to the previous owner when the recipient answers or the offer expires.'
    messages:
      ownershipTransferUpdated:
        $ref: '#/components/messages/OwnershipTransferUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversChannelOverridesUpdated:
    address: servers.channel_overrides_updated
    title: servers.channel_overrides_updated
    messages:
      channelOverridesUpdated:
        $ref: '#/components/messages/ChannelOverridesUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversMemberRolesUpdated:
    address: servers.member_roles_updated
    title: servers.member_roles_updated
    messages:
      memberRolesUpdated:
        $ref: '#/components/messages/MemberRolesUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversOwnerUpdated:
    address: servers.owner_updated
    title: servers.owner_updated
    messages:
      ownerUpdated:
        $ref: '#/components/messages/OwnerUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversRoleDeleted:
    address: servers.role_deleted
    title: servers.role_deleted
    messages:
      roleDeleted:
        $ref: '#/components/messages/RoleDeleted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversRoleUpdated:
    address: servers.role_updated
    title: servers.role_updated
    messages:
      roleUpdated:
        $ref: '#/components/messages/RoleUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  platformHealthChanged:
    address: platform.health_changed
    title: platform.health_changed
    messages:
      healthChanged:
        $ref: '#/components/messages/HealthChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  platformStatusChanged:
    address: platform.status_changed
    title: platform.status_changed
    messages:
      statusChanged:
        $ref: '#/components/messages/StatusChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  messagingUserPresenceChanged:
    address: messaging.user_presence_changed
    title: messaging.user_presence_changed
    messages:
      userPresenceChanged:
        $ref: '#/components/messages/UserPresenceChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversReportUpdated:
    address: servers.report_updated
    title: servers.report_updated
    description: 'ReportUpdated is published by servers when a user or message report is created and every time its status changes. Admin consumes it to build the investigation dossier of a user without asking servers. It is a full snapshot of the report, not a diff. There is no version: the consumer keeps the snapshot with the newest occurred_at of each report, so a repeated or out-of-order delivery doesn''t overwrite newer data (same rule as servers.ServerUpdated). Optional fields are always present and marshal as null when empty (no omitempty): ReportedUserID is null when Kind is KindMessage, ChannelID and MessageID are null when Kind is KindUser, and ResolvedAt is null while the report is pending. It carries neither the reporter nor the moderator who resolved it (data minimization): the dossier is about the reported user, and who reported or resolved is only needed inside servers.'
    messages:
      reportUpdated:
        $ref: '#/components/messages/ReportUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversEmojiCreated:
    address: servers.emoji_created
    title: servers.emoji_created
    description: 'EmojiCreated is published by servers when a custom emoji is added to a server. Like EmojiDeleted, it carries the whole emoji: an emoji never changes after it is created, so its only transition is being deleted, and that transition wins whatever order the two events arrive in.'
    messages:
      emojiCreated:
        $ref: '#/components/messages/EmojiCreated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversEmojiDeleted:
    address: servers.emoji_deleted
    title: servers.emoji_deleted
    description: 'EmojiDeleted is published by servers when a custom emoji is deleted. It can no longer be used in new messages or reactions, but the image stays available: consumers keep it so the messages and reactions that already use it still show it.'
    messages:
      emojiDeleted:
        $ref: '#/components/messages/EmojiDeleted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversResourceChanged:
    address: servers.resource_changed
    title: servers.resource_changed
    description: 'ResourceChanged is published by servers when something a client keeps on screen changed and no other event says so: the server''s name, icon, banner or vanity link, its channels and categories (rename, move, reorder, create), or its roles (reorder, default role). It carries no data, only what to ask for again, so a consumer never needs the new state and a repeated or out-of-order delivery is harmless.'
    messages:
      resourceChanged:
        $ref: '#/components/messages/ResourceChanged'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversServerDeleted:
    address: servers.server_deleted
    title: servers.server_deleted
    messages:
      serverDeleted:
        $ref: '#/components/messages/ServerDeleted'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  serversServerUpdated:
    address: servers.server_updated
    title: servers.server_updated
    description: 'ServerUpdated is published by servers when a server is created and every time its name or owner changes. It is a full snapshot, not a diff, so consumers don''t need the previous state. There is no version: the consumer keeps the snapshot with the newest occurred_at of each server, so a repeated or out-of-order delivery doesn''t overwrite newer data (same rule as the permissions events). Built for admin''s back-office listing, which shows the name, owner and creation date of every server without asking servers.'
    messages:
      serverUpdated:
        $ref: '#/components/messages/ServerUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  usersAccountRegistered:
    address: users.account_registered
    title: users.account_registered
    description: 'AccountRegistered is published by identify once, when an account is created. It carries the data of the account itself (as opposed to the public profile of ProfileUpdated) for the one consumer that needs it: admin''s back-office listing, which searches users by email. Email and CreatedAt never change, so there is no version: a repeated delivery is harmless because applying it again leaves the same values. Do not add this event to consumers that only need the public profile -- the email is private data. EmailVerified is true when the account was born verified (OAuth sign-up) and false for an email sign-up, which stays pending until EmailVerified arrives. Events published before this field existed don''t carry it, so they decode as false.'
    messages:
      accountRegistered:
        $ref: '#/components/messages/AccountRegistered'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  usersEmailVerified:
    address: users.email_verified
    title: users.email_verified
    description: 'EmailVerified is published by identify once, when the user confirms the email of an account created with email sign-up (OAuth sign-ups never publish it: they are already verified in AccountRegistered). Like AccountRegistered it only exists for admin''s back-office listing, which shows unverified accounts as pending. Verification is never undone, so there is no version: a repeated or out-of-order delivery is harmless, and it may arrive before AccountRegistered.'
    messages:
      emailVerified:
        $ref: '#/components/messages/EmailVerified'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  usersProfileUpdated:
    address: users.profile_updated
    title: users.profile_updated
    description: 'ProfileUpdated is published by identify when a user is created and every time their public profile or status changes. It is a full snapshot, not a diff, so consumers don''t need the previous state. Version is identify''s profile_version: it grows with every change of the same user, and a consumer applies a snapshot only if its version is higher than the one it already has (duplicates and out-of-order deliveries are then harmless). Only public fields travel: the email never does.'
    messages:
      profileUpdated:
        $ref: '#/components/messages/ProfileUpdated'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  voiceParticipantJoined:
    address: voice.participant_joined
    title: voice.participant_joined
    messages:
      participantJoined:
        $ref: '#/components/messages/ParticipantJoined'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  voiceParticipantLeft:
    address: voice.participant_left
    title: voice.participant_left
    messages:
      participantLeft:
        $ref: '#/components/messages/ParticipantLeft'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  voicePrivateCall:
    address: voice.private_call
    title: voice.private_call
    messages:
      privateCall:
        $ref: '#/components/messages/PrivateCall'
    bindings:
      $ref: '#/components/channelBindings/discordiaEvents'
  broadcastNewMessage:
    address: broadcast.new_message
    title: broadcast.new_message
    description: NewMessage is sent to every instance of messaging when a message is created, so each one pushes it to the sockets it holds.
    messages:
      broadcastNewMessage:
        $ref: '#/components/messages/BroadcastNewMessage'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastMessageUpdated:
    address: broadcast.message_updated
    title: broadcast.message_updated
    description: MessageUpdated is sent when the text of a message is edited.
    messages:
      broadcastMessageUpdated:
        $ref: '#/components/messages/BroadcastMessageUpdated'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastMessageDeleted:
    address: broadcast.message_deleted
    title: broadcast.message_deleted
    description: MessageDeleted is sent when a message is deleted. It carries no content.
    messages:
      broadcastMessageDeleted:
        $ref: '#/components/messages/BroadcastMessageDeleted'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastReactionUpdated:
    address: broadcast.reaction_updated
    title: broadcast.reaction_updated
    description: ReactionUpdated is sent when somebody adds or removes a reaction.
    messages:
      broadcastReactionUpdated:
        $ref: '#/components/messages/BroadcastReactionUpdated'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastNewDm:
    address: broadcast.new_dm
    title: broadcast.new_dm
    description: NewDM is sent to each participant of a direct conversation when a message arrives.
    messages:
      broadcastNewDm:
        $ref: '#/components/messages/BroadcastNewDm'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastMention:
    address: broadcast.mention
    title: broadcast.mention
    description: Mention is sent to every user a message mentions, wherever they are.
    messages:
      broadcastMention:
        $ref: '#/components/messages/BroadcastMention'
    bindings:
      $ref: '#/components/channelBindings/messagingBroadcast'
  broadcastAccessRevoked:
    address: broadcast.access_revoked
    title: broadcast.access_revoked
    description: AccessRevoked is sent when a user loses access to a server or a channel, so their open sockets leave it.
    messages:
      broadcastAccessRevoked:
