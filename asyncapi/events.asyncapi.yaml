        channel_name:
          type: string
          description: Nombre del canal. Opcional; solo para armar el aviso push.
        content_preview:
          type: string
          maxLength: 160
          description: Extracto del texto editado (unos 140 caracteres), opcional. Solo para armar el aviso push; el consumidor no debe guardarlo.
      required: [event_id, occurred_at, server_id, channel_id, message_id, author_id, mentioned_user_ids]
    MemberBanned:
      description: MemberBanned is published when a member is banned from a server. The same transaction also publishes membership.MemberLeft, so consumers that only track membership don't need to know about bans.
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
        user_id:
          type: string
          description: Usuario baneado.
        banned_by:
          type: string
          description: Usuario (owner, administrador o moderador con BAN_MEMBERS) que ejecutó el ban.
      required: [event_id, occurred_at, server_id, user_id, banned_by]
    MemberKicked:
      description: MemberKicked is published when a member is kicked from a server. Unlike a ban, nothing stops them from rejoining with a valid invitation. The same transaction also publishes membership.MemberLeft, so consumers that only track membership don't need to know about kicks.
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
        user_id:
          type: string
          description: Usuario expulsado.
        kicked_by:
          type: string
          description: Usuario (owner, administrador o miembro con KICK_MEMBERS) que ejecutó la expulsión.
      required: [event_id, occurred_at, server_id, user_id, kicked_by]
    MemberMuted:
      description: MemberMuted is published when a member loses the ability to send messages and publish voice for a limited period. The session remains connected.
      type: object
