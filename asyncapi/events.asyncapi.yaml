          type: string
      required: [event_id, occurred_at, user_id, signature]
    UserReactivated:
      description: UserReactivated is published by admin when staff lifts a suspension. Same fields and rules as UserSuspended.
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: Usuario suspendido o reactivado (ID de discordia-identify).
        version:
          type: integer
          format: int64
          minimum: 1
          description: suspension_version del usuario en admin. Crece con cada suspensión o reactivación; ordena los eventos del mismo usuario.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, user_id, version, signature]
    UserSuspended:
      description: 'UserSuspended is published by admin when staff suspends an account. Every service that serves users (identify, servers, messaging, voice) reacts by rejecting anything that user does and cutting their open sessions. Version is admin''s suspension_version for that user: it grows with every suspension or reactivation, and a consumer applies an event only if its version is higher than the one it already has, so duplicated or out-of-order deliveries are harmless. The reason for the suspension never travels (data minimisation).'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: Usuario suspendido o reactivado (ID de discordia-identify).
        version:
          type: integer
          format: int64
          minimum: 1
          description: suspension_version del usuario en admin. Crece con cada suspensión o reactivación; ordena los eventos del mismo usuario.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, user_id, version, signature]
    AccountChanged:
      description: 'Changed is published by billing every time something of a user''s account that the clients show changes: the points balance and its history (a purchase confirmed, points spent or given back by a boost), the boosts the user holds, or the purchases. It carries no data, only what to ask for again, so a repeated or out-of-order delivery is harmless. Premium has its own signed snapshot, billing.premium_updated. It is not signed: the worst a forged one can do is make a screen ask again for what it already shows.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: Usuario al que se le avisa (ID de discordia-identify).
        resource:
          type: string
          enum:
            - points
            - boosts
            - purchases
          description: 'Qué volver a pedir: el saldo de puntos, los boosts del usuario o sus compras.'
      required: [event_id, occurred_at, user_id, resource]
    BackofficeChanged:
      description: 'Changed is published by admin when something the back-office shows to staff changed: a user, a server, a report, the staff itself or the investigation file of a user or a server. It carries no data, only what to ask for again, and the staff members who should be told, so notifications can push it to them without knowing who is staff. It is not signed: the worst a forged one can do is make a staff screen ask again for what it already shows.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        resource:
          type: string
          enum:
            - users
            - servers
            - reports
            - staff
            - dossier
            - metrics
          description: 'Qué volver a pedir: usuarios, servidores, reportes, el equipo de staff, un expediente o las métricas.'
        audience_user_ids:
          type: array
          items:
            type: string
          description: Miembros del staff a los que hay que avisar.
      required: [event_id, occurred_at, resource, audience_user_ids]
    PremiumUpdated:
      description: 'PremiumUpdated is a full snapshot of a user''s Premium, not a diff. billing publishes it when Premium starts, renews, stops renewing, is revoked (refund or chargeback) or expires. Active is what consumers apply. PremiumUntil (nil if the user never paid) and Renews are for display: when PremiumUntil passes, billing publishes another snapshot with Active false, so consumers never need a clock. Version grows with every snapshot of the same user; a consumer applies an event only if its version is higher than the one it already has, so duplicated or out-of-order deliveries are harmless.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        user_id:
          type: string
          format: uuid
          description: Usuario (ID de discordia-identify).
        active:
          type: boolean
          description: Si el usuario tiene Premium ahora. Es lo único que el consumidor necesita aplicar.
        premium_until:
          type: [string, "null"]
          format: date-time
          description: Hasta cuándo está pago, en UTC. `null` si nunca pagó.
        renews:
          type: boolean
          description: Si Mercado Pago va a volver a cobrar al llegar `premium_until`.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Crece con cada foto del mismo usuario; ordena los eventos.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, user_id, active, premium_until, renews, version, signature]
    ServerBoostRequested:
