      required: [event_id, occurred_at, server_id, channel_id, message_id, author_id, mentioned_user_ids]
    MessageDeleted:
      description: MessageDeleted is published when a message is deleted, in a server channel or in a direct conversation (ServerID is empty then and ChannelID is the conversation). OccurredAt is the moment of the deletion. A consumer drops whatever it kept about MessageID.
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
          description: Servidor del canal. No viaja si el mensaje era directo.
        channel_id:
          type: string
          description: Canal del mensaje, o la conversación si era un mensaje directo.
        message_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
      required: [event_id, occurred_at, channel_id, message_id, author_id]
    MessageUpdated:
      description: 'MessageUpdated is published when the text of a message in a server channel is edited. It carries the mentions the message has after the edit, so a consumer can add the notification of whoever the edit mentioned and remove the one of whoever it stopped mentioning. OccurredAt is the moment of the edit. Direct messages never publish it: they have no mentions.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
