            - manual
            - expired
      required: [event_id, occurred_at, server_id, user_id, unmuted_by, reason]
    ModerationActionRecorded:
      description: 'ModerationActionRecorded is published by servers every time a moderation action (ban, unban, kick, mute or unmute) is written to its audit log. Admin consumes it to build the investigation dossier of a user without asking servers. Meta.OccurredAt is the moment of the action, the same occurred_at as the audit log entry. An audit entry never changes, so the event is immutable: ActionID is the id of the audit entry and the idempotency key, and a repeated delivery with the same ActionID must be ignored. It carries neither the moderator who acted nor the reason (data minimization): the dossier is about the target user, and who acted is only needed inside servers.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        action_id:
          type: string
          format: uuid
          description: Id de la fila de `moderation_audit_entries` en servers. Sirve para deduplicar.
        server_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - ban
            - unban
            - kick
            - mute
            - unmute
        target_user_id:
          type: string
          description: Usuario sobre el que se aplicó la acción (ID de discordia-identify).
      required: [event_id, occurred_at, action_id, server_id, action, target_user_id]
    WordFilterUpdated:
      description: 'WordFilterUpdated is published every time a server''s banned words list changes. It carries the whole list, not a diff, so consumers keep the one with the newest occurred_at and a repeated or late event never undoes a newer change. Words must never be nil: an empty list (no filter) has to marshal as [] and not as null.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
        words:
          type: array
          items:
            type: string
          description: Palabras o frases prohibidas, normalizadas (minúsculas, sin espacios de más). Lista vacía = sin filtro.
      required: [event_id, occurred_at, server_id, words]
    OwnershipTransferUpdated:
      description: 'TransferUpdated is published by servers every time an ownership transfer changes state: when the owner offers it (pending), when the recipient accepts or rejects it, when the owner cancels it and when it expires after 24 hours. It is a full snapshot, so a consumer keeps the one with the newest occurred_at of each transfer and a repeated or out-of-order delivery doesn''t overwrite newer data. OccurredAt is the moment of the change: the creation time for pending and the resolution time for the rest. The notification goes to the recipient while the transfer is pending and to the previous owner when the recipient answers or the offer expires.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        transfer_id:
          type: string
          format: uuid
          description: Identificador de la transferencia.
        server_id:
          type: string
          format: uuid
          description: Servidor cuya propiedad se ofrece.
        from_user_id:
          type: string
          description: Dueño que hace el ofrecimiento.
        to_user_id:
          type: string
          description: Miembro que recibe el ofrecimiento.
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
            - cancelled
            - expired
          description: Estado de la transferencia después del cambio. `expired` es un ofrecimiento sin respuesta a las 24 horas.
        created_at:
          type: string
          format: date-time
          description: Momento en que se hizo el ofrecimiento.
        resolved_at:
          type: string
          format: date-time
          description: Momento en que se resolvió; no viaja mientras está pendiente.
      required: [event_id, occurred_at, transfer_id, server_id, from_user_id, to_user_id, status, created_at]
    ChannelOverridesUpdated:
      type: object
