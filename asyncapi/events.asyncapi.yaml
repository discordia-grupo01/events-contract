  schemas:
    ServerDeletionRequested:
      description: 'ServerDeletionRequested is published by admin when staff asks to delete a server. It is a request, not the fact: servers runs the same cascade it runs when the owner deletes the server and then publishes servers.server_deleted, which the other services already consume. It is irreversible, so servers must check the signature before touching anything. Same fields as ServerSuspended.'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
          description: Servidor suspendido, reactivado o a eliminar (ID de discordia-servers).
        version:
          type: integer
          format: int64
          minimum: 1
          description: moderation_version del servidor en admin. Crece con cada suspensión, reactivación o eliminación; ordena los eventos del mismo servidor.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, server_id, version, signature]
    ServerReactivated:
      description: ServerReactivated is published by admin when staff lifts a server suspension. Same fields and rules as ServerSuspended.
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
          description: Servidor suspendido, reactivado o a eliminar (ID de discordia-servers).
        version:
          type: integer
          format: int64
          minimum: 1
          description: moderation_version del servidor en admin. Crece con cada suspensión, reactivación o eliminación; ordena los eventos del mismo servidor.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, server_id, version, signature]
    ServerSuspended:
      description: 'ServerSuspended is published by admin when staff suspends a server. The server keeps its content, but nobody can use it until it is reactivated: servers rejects every action on it except leaving, messaging rejects reads and writes in its channels and closes their open sockets, and voice takes whoever is connected out of the room. Version is admin''s moderation_version for that server: it grows with every suspension, reactivation or deletion request, and a consumer applies an event only if its version is higher than the one it already has. The reason never travels (data minimisation).'
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
        server_id:
          type: string
          format: uuid
          description: Servidor suspendido, reactivado o a eliminar (ID de discordia-servers).
        version:
          type: integer
          format: int64
          minimum: 1
          description: moderation_version del servidor en admin. Crece con cada suspensión, reactivación o eliminación; ordena los eventos del mismo servidor.
        signature:
          type: string
          description: HMAC-SHA256 en hexadecimal. Ver la sección "Firma" de la descripción del documento.
      required: [event_id, occurred_at, server_id, version, signature]
    StaffMemberAdded:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento. Usar para deduplicar (at-least-once).
        occurred_at:
          type: string
          format: date-time
          description: Momento del hecho de negocio, ISO 8601 en UTC.
