name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Chequeo de formato (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Archivos sin formatear:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -cover
      - name: Schemas, AsyncAPI y ejemplos al día con las structs de Go
        run: go run ./cmd/eventsgen check
      - name: Que el cambio no rompa a publicadores ni consumidores existentes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          go run ./cmd/eventsgen compat "origin/$BASE_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar el AsyncAPI generado con el parser oficial
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          node validate-asyncapi.mjs ../asyncapi/events.asyncapi.yaml

  elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          elixir-version: "1.16.2"
      - run: mix deps.get
      - name: Chequeo de formato (mix format)
        run: mix format --check-formatted "*/events.ex" "admin/*.exs" "validator/*.ex" "validator/*.exs" mix.exs
      - run: mix compile --warnings-as-errors
      - run: mix test

  tag:
    needs: [test, elixir]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear el tag de la próxima versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD ya tiene tag: $(git tag --points-at HEAD | grep '^v')"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          last=${last:-v0.0.0}
          range="HEAD"
          if [ "$last" != "v0.0.0" ]; then range="$last..HEAD"; fi
          IFS=. read -r major minor patch <<< "${last#v}"
          subjects=$(git log "$range" --format='%s%n%b')
          if echo "$subjects" | grep -qiE '^\[?(feat|feature)\]?(\(.*\))?!?(:| )|BREAKING CHANGE'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          next="v$major.$minor.$patch"
          echo "$last -> $next"
          git tag "$next"
          git push origin "$next"
          gh release create "$next" --title "$next" --generate-notes
