name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Chequeo de formato (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Archivos sin formatear:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -cover
